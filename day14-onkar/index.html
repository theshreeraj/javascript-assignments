<body>
    <script>
        let ranN = Math.floor(Math.random() * 11) + 50;
        console.log(ranN);


        let MAX_NUM = Math.max(0, 5, 4, 6, 7, 1, 3, 2);

        console.log("Max Number", MAX_NUM);

        let MIN_NUM = Math.min(0, 5, 4, 6, 7, 1, 3, 2);

        console.log("Min Number", MIN_NUM);
    </script>
